# Tool config only — this repo is not a Python package.

# ── mypy: pragmatic static typing gate (runs in tests.yml lint job) ───────────
# The scripts are deliberately dict-heavy plain Python, so this is NOT strict
# mode: untyped defs stay unchecked; the gate catches real bugs (wrong call
# signatures, bad attribute access, unreachable code) without demanding
# annotations everywhere.
[mypy]
files = scripts
mypy_path = scripts
python_version = 3.11
ignore_missing_imports = True
no_error_summary = False
warn_unused_configs = True
warn_redundant_casts = True
# House style reuses one variable name for successive shapes (e.g. a Counter,
# then its .most_common() list); allow it instead of flagging every re-bind.
allow_redefinition = True
# var-annotated only demands `x: dict[str, int] = {}` annotations on empty
# containers — no bug-finding value here, just churn.
disable_error_code = var-annotated

# ── mutmut: mutation testing, transform.py only (mutation.yml, manual) ────────
# Whole-repo mutation runs for hours with little extra signal; transform.py is
# the highest-value target (every check-in passes through it) and its direct
# test file keeps the per-mutant run fast.
[mutmut]
paths_to_mutate=scripts/transform.py
backup=False
runner=python -m pytest tests/test_transform.py -x -q
tests_dir=tests/
