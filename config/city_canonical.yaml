# ─────────────────────────────────────────────────────────────────────
# city_canonical.yaml — canonical names + nearest-city thresholds for
# the blank-city extractor (scripts/extract_blank_fixes.py).
#
# This is the single source of truth for which raw nearest-city names
# the extractor will *accept* and what canonical name it writes them
# under. city_merge.yaml handles already-non-blank rows; this file is
# specifically for centroid-matched blank rows.
#
# Sections:
#   canonical_map      — raw nearest-city  →  canonical
#   valid_canonical    — canonical names accepted as-is
#   large_canonical    — large cities that get the larger distance bucket
#   default_thresholds — km buckets used when no per-city override exists
#   thresholds         — per-canonical override (km)
#   skip_set           — raw names always skipped (districts, regions)
#   skip_patterns      — regex patterns always skipped
# ─────────────────────────────────────────────────────────────────────

default_thresholds:
  large_km: 8.0
  small_km: 5.5

skip_set:
  - "Минский район"
  - "Minski Rayon"
  - "Hrodzyenski Rayon"
  - "Logoyski Rayon"
  - "Логойский р-н"
  - "Минская Обл."
  - "Vitebsk Region"
  - "Biahoml"
  - "Kamyanyetski Rayon"
  - "д. Бенякони"
  - "Страченята"
  - "д. Страченята"

skip_patterns:
  - 'район$'
  - 'Rayon$'
  - '\sр-н$'
  - 'область$'
  - 'Обл\.$'
  - '\sRegion$'
  - '^д\.\s'

