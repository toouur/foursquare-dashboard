# Dashboard configuration
# Edit this file to customise behaviour without touching Python code.

trip_detection:
  home_city: Chișinău      # current home — check-ins here are "home" (not part of a trip)
  min_checkins: 5          # minimum check-ins outside home to count as a real trip
  # Home city changed over time. Each entry names the home BEFORE its `until`
  # date (exclusive, UTC midnight); at/after the last `until`, `home_city` above
  # applies. So Chișinău was home from the earliest (backfilled) check-in until
  # the move to Minsk on 2012-09-01 — those Chișinău check-ins are home, not a
  # trip, while the 2008 Black Sea run stays a trip. Minsk was then home until
  # the move back to Chișinău on 2026-07-29. Keep sorted by `until`.
  home_history:
    - city: Chișinău
      until: "2012-09-01"
      # venue_id(s) that ARE home. A check-in at one of these counts as the
      # homecoming regardless of its Foursquare category (e.g. "Str. Alecu
      # Russo, 55" is categorised "Apartment or Condo", not "Home (private)").
      # home_venue_ids is a UNION across eras, so this list also serves the
      # 2026-07-29 → Chișinău era below.
      # This venue DOES have real check-ins (59, 2013-01-20 → 2026-07-28), so it
      # is load-bearing twice in trips.py: as the homecoming target of the
      # home-arrival extension, and via the `ends_at_home` guard — a trip whose
      # LAST check-in is here ends there, with no arrival-hub extension into the
      # following day (that is what makes the 2026-07-17 relocation trip end on
      # 2026-07-28 at this address instead of running into 07-29).
      venues:
        - 50fbc23ae4b0afd6fe382f57   # Str. Alecu Russo, 55 (Chișinău home)
      # Same Chișinău rules as the current era below — this IS a Moldova era,
      # and it flies out of the same airport. Without them the 31.05.2012
      # Moscow run began at Domodedovo on landing, with the four Chișinău rows
      # that precede it (RMO → security → passport control → waiting hall) cut
      # off. See the current-era entry for what each flag does.
      air_departure: true
      arrival_transit: true
      arrival_neighborhoods:
        - Ciocana (Sectorul Ciocana)
      departure_ride_categories: [Taxi]
      arrival_stop_at_home: true
      arrival_max_city_checkins: 3
      hub_categories: [Platform]
    - city: Minsk
      until: "2026-07-29"
      # No arrival/departure flags: the Minsk years are FROZEN on the original
      # behaviour on purpose. From Minsk the airport is reached by the airport
      # bus or train, so all 37 Minsk flight trips already opened at a
      # "Bus Station" / "Rail Station"; switching them to the airport rules
      # would re-cut 13 years of settled trips for no gain.
    - city: Chișinău
      until: "2099-01-01"          # current era — an explicit, bounded entry so
                                   # the rules below can be scoped to it alone
      venues:
        - 50fbc23ae4b0afd6fe382f57   # Str. Alecu Russo, 55 (Chișinău home)
      # ── Era-scoped trip rules (omitted ⇒ the original behaviour) ───────────
      # air_departure: the airport complex counts as a departure hub. Needed
      #   because Foursquare almost never emits the bare "Airport" category —
      #   28 of ~1000 airport check-ins — and Chișinău's RMO has none at all,
      #   it is always "International Airport". Without this the whole outbound
      #   leg (taxi → RMO → security → gate → plane) was cut off and the trip
      #   started only on landing abroad. DEPARTURE only: on arrival the scan
      #   stops at the nearest hub, which is right for a bus/rail arrival but
      #   would truncate a flight home at passport control.
      air_departure: true
      # arrival_transit: tolerate a neighbouring town on the ride in from the
      #   airport. The RMO airport bus is geotagged "Ialoveni", not "Chișinău"
      #   (RMO sits on the municipal boundary), and that row used to end the
      #   arrival scan two hours short of the front door.
      arrival_transit: true
      # arrival_neighborhoods: accepted as the homecoming when the trip does
      #   NOT end at one of `venues` above — the district stood in for the
      #   address.
      arrival_neighborhoods:
        - Ciocana (Sectorul Ciocana)
      # departure_ride_categories: the ride TO the departure hub opens the trip
      #   (the taxi to RMO), if it is within 90 min before the hub.
      departure_ride_categories: [Taxi]
      # arrival_stop_at_home: on the way back, the first sign of being home ends
      #   the trip — `venues`, `arrival_neighborhoods`, or a "City" check-in in
      #   the home city ("back in Chișinău"). Without it the arrival scan walked
      #   past the front door to the next day's bus station.
      arrival_stop_at_home: true
      # arrival_max_city_checkins: safety net for when there is no "City"
      #   check-in or bar to end the trip. More than this many home-city stops
      #   that are not part of the ride home (transport, roads, City /
      #   Neighborhood check-ins don't count) before reaching home ⇒ the trip
      #   ended on arriving in the city; the rest was a separate outing.
      arrival_max_city_checkins: 3
      # hub_categories: extra categories that count as a home transport hub on
      #   BOTH legs. Chișinău's suburban rail ("Gara Feroviară Chișinău
      #   Suburban") is a "Platform", not a "Rail Station", so the Bender /
      #   Călărași trains that left from it began only on arrival. Minsk has
      #   35 platform check-ins at its main station and stays frozen without it.
      hub_categories: [Platform]
  # Optional: path to a hand-curated trips YAML override file.
  # When set, the automatic detection is skipped and these dates are used instead.
  # trips_override_file: trips_manual.yaml

dashboard:
  title: "Check-in Journal"
  subtitle_source: "Foursquare"
  foursquare_user_id: "29447180"   # used for Swarm checkin links

# CARTO basemap key (free, non-commercial: https://carto.com/basemaps/apikey).
# Public by design — it ships in every page — and domain-restricted at CARTO.
# Substituted into {{CARTO_KEY}} in every tile URL; env CARTO_API_KEY overrides.
basemap:
  carto_key: "cb1_4jrw_1_42fc1bd62cab3196cc180c0b"

output:
  index_html: index.html
  trips_html: trips.html

# Override the "first visit" year for a country in the New Countries by Year timeline.
# Covers both legacy and current API spellings of the same country.
new_country_year_overrides:
  "Türkiye": 2020
  "Turkey":  2020
