# .github/workflows/update-dashboard.yml
#
# Two separate jobs depending on trigger:
#
# [push to main]  → verify: checkout → build only (no fetch, no commit, no Cloudflare deploy)
#                   Guards against broken builds being merged.
#
# [hourly schedule / manual dispatch]
#                 → update: fetch check-ins + tips → if neither changed, exit gracefully.
#                   If check-ins OR tips changed: rebuild → commit & push → Cloudflare auto-deploys.
#
# Required repository secrets:
#   FOURSQUARE_TOKEN   — Foursquare OAuth token
#   DATA_REPO_PAT      — Fine-grained PAT with Contents read/write on toouur/foursquare-data
#   NETLIFY_SITE_ID    — found in Netlify site settings → General → Site ID
#   NETLIFY_AUTH_TOKEN — personal access token from app.netlify.com/user/applications

name: Update check-in dashboard

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "0 */1  * * *"   # every hour
  push:
    branches: [main]         # verify build on every push (no deploy)
  workflow_dispatch:         # manual trigger button in GitHub UI

permissions:
  contents: write
  actions: read     # alert step reads previous run conclusions via gh api

jobs:

  # ── Verify: build-only check on every push to main (no Cloudflare deploy) ──
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Checkout private data repo (shallow: verify only reads the working tree) ─
      - uses: actions/checkout@v4
        with:
          repository: toouur/foursquare-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: private-data
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard (verify only — no commit or deploy)
        run: |
          RATINGS_ARG=""
          if [ -f private-data/venueRatings.json ]; then RATINGS_ARG="--ratings private-data/venueRatings.json"; fi
          LISTS_ARG=""
          if [ -f private-data/lists.json ]; then LISTS_ARG="--lists private-data/lists.json"; fi
          python scripts/build.py \
            --input private-data/checkins.csv \
            --config-dir config \
            --output-dir . \
            $RATINGS_ARG $LISTS_ARG

      - name: Validate generated HTML
        run: python scripts/validate_html.py --dir . --quiet

  # ── Update: fetch → skip if no new check-ins → rebuild → commit → deploy ──
  #   Pause switch: set repo variable UPDATES_PAUSED=true (Settings → Secrets and
  #   variables → Actions → Variables) to halt scheduled/dispatch runs — e.g.
  #   while rewriting git history. Set it back to false (or delete it) to resume.
  update:
    if: |
      vars.UPDATES_PAUSED != 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout public repo ───────────────────────────────────────────────
      #   Shallow (depth 1): this job only builds → commits → pushes and never
      #   reads git history. Full history is a 4GB+ clone (hourly HTML commits),
      #   which made checkout take ~3.5 min. fetch-depth:1 keeps it to seconds.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Checkout private data repo ────────────────────────────────────────
      #   Shallow (depth 1): this job reads the current working tree (checkins.csv,
      #   pix/, routes_cache.json) and pushes new commits — it never walks history.
      #   The data repo gets hourly data commits + binary photos, so a full clone
      #   is ~15s; depth-1 keeps it to a few seconds. The later rebase-and-retry
      #   push still works on a shallow clone (git fetches what it needs to rebase).
      - uses: actions/checkout@v4
        with:
          repository: toouur/foursquare-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: private-data
          fetch-depth: 1

      # ── 3. Python setup ──────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Fetch new check-ins ───────────────────────────────────────────────
      #   NO --recheck-recent-hours here: the historic overlap re-scan (re-fetching
      #   friend tags added AFTER a check-in was first posted) is the expensive part
      #   — it prints CHANGED=true every hour even with zero new posts, forcing a
      #   full rebuild+deploy. It lives in the separate daily `recheck-enrich.yml`
      #   instead, so most hourly/manual/poller runs fetch 0 new → hit "Skip if no
      #   new data" → finish in ~50s. Brand-new check-ins still get their overlaps
      #   enriched at fetch time (fetch_checkins.py enriches `added` rows directly).
      - name: Fetch new Swarm check-ins
        id: fetch
        env:
          FOURSQUARE_TOKEN: ${{ secrets.FOURSQUARE_TOKEN }}
        run: |
          if [ -z "$FOURSQUARE_TOKEN" ]; then
            echo "⚠️  FOURSQUARE_TOKEN secret is not set — skipping fetch."
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          else
            python scripts/fetch_checkins.py --token "$FOURSQUARE_TOKEN" --csv private-data/checkins.csv >> "$GITHUB_OUTPUT"
          fi

      # ── 4b. Fetch new tips ───────────────────────────────────────────────────
      - name: Fetch new Foursquare tips
        id: fetch_tips
        env:
          FOURSQUARE_TOKEN: ${{ secrets.FOURSQUARE_TOKEN }}
        run: |
          if [ -z "$FOURSQUARE_TOKEN" ]; then
            echo "⚠️  FOURSQUARE_TOKEN secret is not set — skipping tips fetch."
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          else
            python scripts/fetch_tips.py --token "$FOURSQUARE_TOKEN" --out private-data/tips.json --csv private-data/checkins.csv >> "$GITHUB_OUTPUT"
          fi

      # ── 4c. Fetch photos for new check-ins ──────────────────────────────────
      #   NO --recheck-days here: re-probing already-indexed recent check-ins for
      #   late-added photos is the slow historic pass and moves to the daily
      #   `recheck-enrich.yml`. This step still downloads photos for genuinely-new
      #   check-ins (fetch_photos treats any check-in past the export cutoff and not
      #   yet indexed as pending regardless of the recheck window).
      - name: Fetch photos for new check-ins
        id: fetch_photos
        env:
          FOURSQUARE_TOKEN: ${{ secrets.FOURSQUARE_TOKEN }}
        run: |
          if [ -z "$FOURSQUARE_TOKEN" ]; then
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          else
            python scripts/fetch_photos.py \
              --token "$FOURSQUARE_TOKEN" \
              --csv   private-data/checkins.csv \
              --out   private-data/photos.json \
              --pix-dir private-data/pix \
              --sleep 0.3 >> "$GITHUB_OUTPUT"
          fi

      # ── 4d. Fetch updated venue ratings (throttled to every 3 days) ──────────
      #   Likes come from the PRIMARY /v2/users/self/venuelikes endpoint, which
      #   has a MONTHLY premium-call quota (~220 calls, empirical) that resets on
      #   the 1st and returns 402 once spent. Each fetch paginates the full likes
      #   list (~1.4k items ≈ 7-8 calls). At the old hourly cadence that was
      #   ~8.6k calls/month → exhausted the allowance in ~3 days. Every-3-days
      #   (≈10 runs/mo × ~8 = ~80 calls ≈ 36% of budget) keeps the endpoint alive
      #   all month with headroom. Fires at 04:00 UTC on days where day-of-year is
      #   divisible by 3; manual dispatch bypasses the gate.
      - name: Fetch venue ratings
        id: fetch_ratings
        env:
          FOURSQUARE_TOKEN: ${{ secrets.FOURSQUARE_TOKEN }}
        run: |
          DOY=$(date -u +%j)   # day-of-year, 001…366 (zero-padded)
          HOUR=$(date -u +%H)  # 00 … 23 (hourly cron fires at minute 0)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && ! { [ "$((10#$DOY % 3))" = "0" ] && [ "$HOUR" = "04" ]; }; then
            echo "⏭  Ratings fetch is throttled to every 3 days (04:00 UTC) — skipping (DOY=$DOY HOUR=$HOUR)."
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
            echo "LIKES_UNAVAILABLE=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$FOURSQUARE_TOKEN" ]; then
            echo "⚠️  FOURSQUARE_TOKEN secret is not set — skipping ratings fetch."
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          else
            python scripts/fetch_ratings.py --token "$FOURSQUARE_TOKEN" --out private-data/venueRatings.json --user-id 29447180 >> "$GITHUB_OUTPUT"
          fi

      # ── 4e. Surface a lost likes-endpoint entitlement loudly ─────────────────
      - name: Warn if likes endpoint unavailable
        if: steps.fetch_ratings.outputs.LIKES_UNAVAILABLE == 'true'
        run: |
          echo "::warning title=Likes unavailable::/v2/users/self/venuelikes returned no data (402 or network error). New likes are NOT being auto-synced — update via data export + --force-ratings."

      # ── 4f. Upload new photos to Cloudflare R2 ──────────────────────────────
      - name: Upload new photos to R2
        if: steps.fetch_photos.outputs.CHANGED == 'true'
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME:        ${{ secrets.R2_BUCKET_NAME }}
        run: |
          pip install awscli --quiet
          aws s3 sync private-data/pix/ s3://${R2_BUCKET_NAME}/pix/ \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --no-progress

      # ── 5. Exit gracefully if nothing changed ────────────────────────────────
      - name: Skip if no new data
        if: |
          github.event_name != 'workflow_dispatch' &&
          steps.fetch.outputs.CHANGED != 'true' &&
          steps.fetch_tips.outputs.CHANGED != 'true' &&
          steps.fetch_photos.outputs.CHANGED != 'true' &&
          steps.fetch_ratings.outputs.CHANGED != 'true'
        run: |
          echo "No new data — nothing to rebuild or deploy."
          exit 0

      # ── 6. Commit updated data files to private data repo ────────────────────
      - name: Commit updated data files to data repo
        if: |
          steps.fetch.outputs.CHANGED == 'true' ||
          steps.fetch_tips.outputs.CHANGED == 'true' ||
          steps.fetch_photos.outputs.CHANGED == 'true' ||
          steps.fetch_ratings.outputs.CHANGED == 'true'
        run: |
          cd private-data
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checkins.csv tips.json photos.json
          [ -f venueRatings.json ] && git add venueRatings.json || true
          [ -f lists.json ]        && git add lists.json        || true
          if git diff --cached --quiet; then
            echo "Nothing to commit in data repo."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore: update data [${TIMESTAMP}]"
            # Another workflow (warm-routes / fr24-flights / a concurrent run of
            # this job) may push to the same data-repo ref between our checkout and
            # this push, causing a non-fast-forward rejection. Rebase-and-retry.
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              echo "push rejected (attempt $i) — rebasing onto latest main"
              git pull --rebase origin main
              [ "$i" = 5 ] && { echo "push still failing after rebase retries"; exit 1; }
            done
          fi
          cd ..

      # ── 7. Rebuild dashboard ─────────────────────────────────────────────────
      - name: Rebuild dashboard
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.fetch.outputs.CHANGED == 'true' ||
          steps.fetch_tips.outputs.CHANGED == 'true' ||
          steps.fetch_photos.outputs.CHANGED == 'true' ||
          steps.fetch_ratings.outputs.CHANGED == 'true'
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          PIX_URL_ARG=""
          if [ -n "$R2_PUBLIC_URL" ]; then
            PIX_URL_ARG="--pix-url ${R2_PUBLIC_URL}"
          fi
          PHOTOS_ARG=""
          if [ -f private-data/photos.json ]; then
            PHOTOS_ARG="--photos private-data/photos.json"
          fi
          RATINGS_ARG=""
          if [ -f private-data/venueRatings.json ]; then
            RATINGS_ARG="--ratings private-data/venueRatings.json"
          fi
          LISTS_ARG=""
          if [ -f private-data/lists.json ]; then
            LISTS_ARG="--lists private-data/lists.json"
          fi
          # Route-geometry fetching is fully delegated to warm-routes.yml
          # (daily 03:00 UTC + manual dispatch): --routes-max-fetch 0 here means
          # this build reads the cached polylines but makes ZERO OSRM/BRouter
          # calls, keeping the hourly poller off the network-bound path entirely.
          # Tradeoff: a brand-new check-in's road polyline appears a day late
          # (on the next warm run's cache) instead of the same build — accepted,
          # since the warm job drains the whole backlog daily anyway.
          python scripts/build.py \
            --input private-data/checkins.csv \
            --config-dir config \
            --output-dir . \
            --routes-cache private-data/routes_cache.json \
            --routes-max-fetch 0 \
            $PHOTOS_ARG $PIX_URL_ARG $RATINGS_ARG $LISTS_ARG

      # ── 7c. Persist warmed route-geometry cache to the data repo ─────────────
      #   With --routes-max-fetch 0 the hourly build no longer fetches routes, so
      #   routes_cache.json is normally unchanged here (this step then just prints
      #   "unchanged") — warm-routes.yml owns cache growth. Kept as a cheap safety
      #   net so any incidental cache write still gets committed before a later
      #   validate/deploy step could fail and lose it.
      - name: Commit route cache to data repo
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.fetch.outputs.CHANGED == 'true' ||
          steps.fetch_tips.outputs.CHANGED == 'true' ||
          steps.fetch_photos.outputs.CHANGED == 'true' ||
          steps.fetch_ratings.outputs.CHANGED == 'true'
        run: |
          cd private-data
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f routes_cache.json ] && git add routes_cache.json || true
          if git diff --cached --quiet; then
            echo "Route cache unchanged."
          else
            git commit -m "chore: warm route-geometry cache"
            git push || { git pull --rebase && git push; }
          fi
          cd ..

      # ── 7a. Validate generated HTML before anything ships ────────────────────
      #   Fails the job (so nothing deploys) on unreplaced {{PLACEHOLDER}}s,
      #   truncated pages, or embedded JSON that doesn't parse.
      - name: Validate generated HTML
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.fetch.outputs.CHANGED == 'true' ||
          steps.fetch_tips.outputs.CHANGED == 'true' ||
          steps.fetch_photos.outputs.CHANGED == 'true' ||
          steps.fetch_ratings.outputs.CHANGED == 'true'
        run: python scripts/validate_html.py --dir . --quiet

      # ── 7a-bis. City-count drift gate ────────────────────────────────────────
      #   Runs the real transform pipeline and compares the distinct normalized
      #   city set to config/city_count_baseline.json. HARD-fails the job (blocks
      #   deploy) only on invariant bugs — a displayed city that is non-NFC or a
      #   fold-collision, i.e. a normalization miss (Foursquare renamed a city and
      #   it slipped past every string rule). New/renamed cities are reported to
      #   the run summary but do NOT block. Refresh the baseline after a real
      #   change: python scripts/check_city_count.py --csv ... --baseline
      #   config/city_count_baseline.json --update-baseline (then commit it).
      - name: City-count drift gate
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.fetch.outputs.CHANGED == 'true' ||
          steps.fetch_tips.outputs.CHANGED == 'true' ||
          steps.fetch_photos.outputs.CHANGED == 'true' ||
          steps.fetch_ratings.outputs.CHANGED == 'true'
        run: |
          echo '### City-count drift gate' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python scripts/check_city_count.py \
            --csv private-data/checkins.csv \
            --config-dir config \
            --baseline config/city_count_baseline.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # ── 7b. Warm the wrangler install cache ──────────────────────────────────
      #   The deploy runs `npx wrangler@3`, which otherwise cold-downloads wrangler
      #   (+deps) into ~/.npm on every run — several seconds on the critical path.
      #   Persist ~/.npm (npm's cache + the _npx package dir) keyed on the pinned
      #   major, so after the first run npx resolves wrangler straight from cache.
      #   Bump the key suffix if the `wrangler@N` major below changes.
      - name: Cache wrangler (npm)
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.fetch.outputs.CHANGED == 'true' ||
          steps.fetch_tips.outputs.CHANGED == 'true' ||
          steps.fetch_photos.outputs.CHANGED == 'true' ||
          steps.fetch_ratings.outputs.CHANGED == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-wrangler3-${{ runner.os }}

      # ── 7c. Sync D1 (in background) ∥ assemble & deploy ─────────────────────
      #   D1 sync (~13s of HTTP) and the Cloudflare Pages upload are independent —
      #   the sync needs only the CSV/tips, the deploy needs only the built HTML —
      #   so we background the sync and let it run WHILE the deploy uploads, then
      #   reap it at the end. Merging the two former steps is required because a
      #   backgrounded process can't be `wait`ed across step boundaries.
      #   NOTE: D1 sync keeps its stricter gate (NOT on a photos-only change) via
      #   the RUN_D1 flag; assemble+deploy still run on any change.
      #   The generated HTML is NOT committed to git (it bloated history to 4GB+);
      #   we deploy it directly to Cloudflare Pages via wrangler. Copy only known
      #   site assets — never the working dir wholesale (it holds private-data/).
      - name: Sync D1 (background), assemble & deploy
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.fetch.outputs.CHANGED == 'true' ||
          steps.fetch_tips.outputs.CHANGED == 'true' ||
          steps.fetch_photos.outputs.CHANGED == 'true' ||
          steps.fetch_ratings.outputs.CHANGED == 'true'
        env:
          CF_D1_TOKEN:       ${{ secrets.CF_D1_TOKEN }}
          CF_ACCOUNT_ID:     ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          # Deploy reuses CF_D1_TOKEN — that token also carries the
          # "Account → Cloudflare Pages → Edit" permission (no separate secret).
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CF_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          # D1 sync runs on checkin/tips/ratings changes but NOT a photos-only
          # rebuild (photos don't touch D1). Evaluated to 'true'/'false' by Actions.
          RUN_D1: ${{ github.event_name == 'workflow_dispatch' || steps.fetch.outputs.CHANGED == 'true' || steps.fetch_tips.outputs.CHANGED == 'true' || steps.fetch_ratings.outputs.CHANGED == 'true' }}
        run: |
          # ── Kick off the D1 sync in the background (overlaps the deploy) ──
          D1_PID=""
          if [ "$RUN_D1" = "true" ] && [ -n "$CF_D1_TOKEN" ]; then
            RATINGS_ARG=""
            if [ -f private-data/venueRatings.json ]; then RATINGS_ARG="--ratings private-data/venueRatings.json"; fi
            LISTS_ARG=""
            if [ -f private-data/lists.json ]; then LISTS_ARG="--lists private-data/lists.json"; fi
            # `set +e` inside the subshell so a non-zero sync still reaches the
            # `echo $? > /tmp/d1_rc` line — otherwise the step's errexit kills the
            # subshell at python and the reaper reads a missing file as failure.
            ( set +e; python scripts/sync_to_d1.py \
                --csv             private-data/checkins.csv \
                --tips            private-data/tips.json \
                --trips           trips_meta.json \
                --tips-changed    ${{ steps.fetch_tips.outputs.CHANGED    || 'false' }} \
                --ratings-changed ${{ steps.fetch_ratings.outputs.CHANGED || 'false' }} \
                --lists-changed   ${{ steps.fetch.outputs.CHANGED         || 'false' }} \
                --trips-changed   ${{ steps.fetch.outputs.CHANGED         || 'false' }} \
                $RATINGS_ARG $LISTS_ARG; echo $? > /tmp/d1_rc ) &
            D1_PID=$!
            echo "D1 sync started in background (pid $D1_PID) — overlapping deploy."
          elif [ -z "$CF_D1_TOKEN" ]; then
            echo "⚠️  CF_D1_TOKEN not set — skipping D1 sync."
          else
            echo "⏭  No checkin/tips/ratings change — skipping D1 sync (photos-only rebuild)."
          fi

          # ── Assemble the clean deploy dir (root asset globs match files only) ──
          rm -rf _site && mkdir -p _site
          cp ./*.html ./*.json ./*.xml ./*.svg ./*.txt ./*.csv ./*.js ./*.webmanifest ./site-*.css _site/ 2>/dev/null || true
          cp -r assets   _site/assets
          cp -r functions _site/functions   # Cloudflare Pages Functions
          rm -rf _site/private-data _site/scripts _site/config _site/templates _site/.git
          echo "Deploy dir contents:" && ls _site

          # ── Deploy to Cloudflare Pages (direct upload) ──
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Deploy skipped::CF_D1_TOKEN not set — cannot deploy to Pages."
            exit 1
          fi
          # `set +e` so a wrangler failure doesn't abort the step under errexit
          # before we can capture the rc / reap the background sync. The Cloudflare
          # API occasionally returns a transient 5xx (e.g. 521 "web server down"),
          # so retry the upload a few times with backoff before giving up.
          set +e
          DEPLOY_RC=1
          for attempt in 1 2 3; do
            npx --yes wrangler@3 pages deploy _site \
              --project-name 4sq \
              --branch main \
              --commit-dirty=true
            DEPLOY_RC=$?
            [ "$DEPLOY_RC" = "0" ] && break
            echo "::warning title=Deploy retry::wrangler exited $DEPLOY_RC on attempt $attempt/3 — retrying in $((attempt*10))s"
            sleep $((attempt*10))
          done

          # ── Reap the backgrounded D1 sync; fail the job if either failed ──
          D1_RC=0
          if [ -n "$D1_PID" ]; then
            wait "$D1_PID" || true
            D1_RC="$(cat /tmp/d1_rc 2>/dev/null || echo 1)"
            [ "$D1_RC" = "0" ] && echo "D1 sync completed OK (overlapped with deploy)."
          fi
          set -e
          if [ "$DEPLOY_RC" != "0" ]; then
            echo "::error title=Deploy failed::wrangler pages deploy exited $DEPLOY_RC"
            exit "$DEPLOY_RC"
          fi
          if [ "$D1_RC" != "0" ]; then
            echo "::error title=D1 sync failed::sync_to_d1.py exited $D1_RC"
            exit 1
          fi

      # ── 9. Alert on REPEATED failure (Telegram) ──────────────────────────────
      #   GitHub already emails on the first failure; the risk worth paging for
      #   is silent data-staleness — the hourly job failing over and over. Only
      #   pings when the previous scheduled/dispatched run of this workflow ALSO
      #   failed (≥2 consecutive), so a one-off network blip stays quiet.
      #   Needs secrets TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID; skips gracefully
      #   when unset.
      - name: Alert on repeated failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set — skipping alert."
            exit 0
          fi
          # Conclusion of the most recent COMPLETED scheduled run before this one
          # (push-triggered verify runs are a different job — excluded by event).
          PREV=$(gh api "repos/${{ github.repository }}/actions/workflows/update-dashboard.yml/runs?event=schedule&status=completed&per_page=5" \
                 --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].conclusion")
          echo "Previous scheduled run conclusion: ${PREV:-none}"
          if [ "$PREV" != "failure" ]; then
            echo "First failure in a row — GitHub's own email is enough, not paging."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TG_CHAT}" \
            --data-urlencode text="🔴 4sq dashboard: hourly update failed ≥2 times in a row — data may be going stale. ${RUN_URL}" \
            > /dev/null && echo "Telegram alert sent."

  # ── Monthly job: deploy to Netlify on the last day of each month ────────────
  #   The site HTML is no longer committed to git, so this job rebuilds it from
  #   the private data repo and deploys the assembled _site/ (same dir the Pages
  #   deploy uses) rather than the repo root.
  netlify-monthly:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && vars.UPDATES_PAUSED != 'true'
    needs: update

    steps:
      - name: Check if today is last day of month
        id: lastday
        run: |
          TODAY=$(date -u +%d)
          LAST=$(date -u -d "$(date -u +%Y-%m-01) +1 month -1 day" +%d)
          if [ "$TODAY" = "$LAST" ]; then
            echo "is_last_day=true"  >> "$GITHUB_OUTPUT"
          else
            echo "is_last_day=false" >> "$GITHUB_OUTPUT"
            echo "Not the last day of month ($TODAY/$LAST) — skipping Netlify deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.lastday.outputs.is_last_day == 'true'

      - uses: actions/checkout@v4
        if: steps.lastday.outputs.is_last_day == 'true'
        with:
          repository: toouur/foursquare-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: private-data
          fetch-depth: 1

      - uses: actions/setup-python@v5
        if: steps.lastday.outputs.is_last_day == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.lastday.outputs.is_last_day == 'true'
        run: pip install -r requirements.txt

      - name: Rebuild dashboard
        if: steps.lastday.outputs.is_last_day == 'true'
        env:
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          PIX_URL_ARG=""; [ -n "$R2_PUBLIC_URL" ] && PIX_URL_ARG="--pix-url ${R2_PUBLIC_URL}"
          PHOTOS_ARG="";  [ -f private-data/photos.json ]       && PHOTOS_ARG="--photos private-data/photos.json"
          RATINGS_ARG=""; [ -f private-data/venueRatings.json ] && RATINGS_ARG="--ratings private-data/venueRatings.json"
          LISTS_ARG="";   [ -f private-data/lists.json ]        && LISTS_ARG="--lists private-data/lists.json"
          python scripts/build.py \
            --input private-data/checkins.csv \
            --config-dir config \
            --output-dir . \
            --routes-cache private-data/routes_cache.json \
            --routes-max-fetch 0 \
            $PHOTOS_ARG $PIX_URL_ARG $RATINGS_ARG $LISTS_ARG

      - name: Validate generated HTML
        if: steps.lastday.outputs.is_last_day == 'true'
        run: python scripts/validate_html.py --dir . --quiet

      - name: Assemble deploy directory
        if: steps.lastday.outputs.is_last_day == 'true'
        run: |
          rm -rf _site && mkdir -p _site
          cp ./*.html ./*.json ./*.xml ./*.svg ./*.txt ./*.csv ./*.js ./*.webmanifest ./site-*.css _site/ 2>/dev/null || true
          cp -r assets   _site/assets
          cp -r functions _site/functions
          rm -rf _site/private-data _site/scripts _site/config _site/templates _site/.git

      - name: Deploy to Netlify
        if: steps.lastday.outputs.is_last_day == 'true'
        env:
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npm install -g netlify-cli
          netlify deploy \
            --site  "$NETLIFY_SITE_ID" \
            --auth  "$NETLIFY_AUTH_TOKEN" \
            --dir   "_site" \
            --prod \
            --message "Monthly deploy $(date -u +%Y-%m-%d)"
          echo "Netlify deploy complete."