# .github/workflows/fix-city-country-d1.yml
#
# Manual workflow: UPDATE all D1 checkin rows where the transform pipeline
# (city_fixes.json, country_fixes.json, city_merge.yaml, blank-city resolver)
# produces a different city or country than the raw CSV value.
#
# Use after:
#   • Adding entries to city_fixes.json or country_fixes.json
#   • city_merge.yaml canonical name changes
#   • Any time blank-city resolver coverage is extended (new city_review.csv)
#
# Required repository secrets:
#   DATA_REPO_PAT      — Fine-grained PAT with Contents read on toouur/foursquare-data
#   CF_D1_TOKEN        — Cloudflare API token with D1:Edit permission
#   CF_ACCOUNT_ID      — Cloudflare account ID
#   CF_D1_DATABASE_ID  — D1 database ID

name: Fix city/country in D1

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/city_merge.yaml"
      - "config/city_fixes.json"
      - "config/country_fixes.json"
      - "config/city_canonical.yaml"
      - "city_review.csv"

jobs:
  fix-city-country:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: toouur/foursquare-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: private-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fix city/country in D1
        env:
          CF_D1_TOKEN:       ${{ secrets.CF_D1_TOKEN }}
          CF_ACCOUNT_ID:     ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          if [ -z "$CF_D1_TOKEN" ]; then
            echo "CF_D1_TOKEN not set — cannot run."
            exit 1
          fi

          python scripts/sync_to_d1.py \
            --csv         private-data/checkins.csv \
            --tips        private-data/tips.json \
            --trips       trips_meta.json \
            --city-review city_review.csv \
            --fix-city-country
