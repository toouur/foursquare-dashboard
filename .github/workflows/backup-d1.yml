# .github/workflows/backup-d1.yml
#
# Weekly D1 backup: exports checkins + venues row counts as a lightweight
# audit artifact and optionally exports the full checkins CSV from D1.
# Runs every Monday at 04:00 UTC.
#
# Required secrets:
#   CF_D1_TOKEN        — Cloudflare API token with D1:Read permission
#   CF_ACCOUNT_ID      — Cloudflare account ID
#   CF_D1_DATABASE_ID  — D1 database ID

name: Weekly D1 backup

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 4 * * 1'   # Monday 04:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Export row counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          wrangler d1 execute swarmdata \
            --command="SELECT 'checkins' tbl,COUNT(*) n FROM checkins
                       UNION ALL SELECT 'venues',COUNT(*) FROM venues
                       UNION ALL SELECT 'tips',COUNT(*) FROM tips
                       UNION ALL SELECT 'ratings',COUNT(*) FROM ratings
                       UNION ALL SELECT 'trips',COUNT(*) FROM trips" \
            --remote | tee d1_row_counts.txt

      - name: Upload row-count artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-row-counts-${{ github.run_id }}
          path: d1_row_counts.txt
          retention-days: 90
