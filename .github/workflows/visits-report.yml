# .github/workflows/visits-report.yml
#
# Weekly private digest of site visits (scripts/visits_report.py): the D1
# `visits` table written by functions/api/hit.js — page views and visitors, browser language/timezone,
# device type/screen/model, coarse postal area, visible page time and 30-minute session depth —
# sent to the PRIVATE alerts chat for the last 7 days vs the previous 7.
# (TELEGRAM_CHAT_ID, never the public on-this-day channel). The same run deletes
# rows older than 90 days. Reads/writes D1 only; never touches the data repo.
#
# Every 3 h the same job runs `--ping`: a short note of the visitors since the
# previous ping (watermark in D1 sync_state), sent only when there were any.

name: Visits report (weekly)

on:
  schedule:
    - cron: '0 7 * * 1'      # Monday 07:00 UTC — the weekly digest
    - cron: '20 */3 * * *'   # every 3 h — the short ping (silent without visitors)
  workflow_dispatch:
    inputs:
      ping:
        description: 'Short ping (visitors since the last ping) instead of the weekly digest'
        type: boolean
        default: false
      dry_run:
        description: 'Print the report only, send and delete nothing'
        type: boolean
        default: false

concurrency:
  group: visits-report     # two pings at once would both read the same watermark
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    if: vars.UPDATES_PAUSED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests
      - name: Send visits report
        env:
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd scripts
          python visits_report.py \
            ${{ (github.event.schedule == '20 */3 * * *' || inputs.ping) && '--ping' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
