# .github/workflows/fix-overlaps.yml
#
# Manual workflow: re-fetch overlapping friends for specific check-ins.
#
# Use when:
#   - A friend appeared on Swarm after the initial fetch (e.g. checked in later)
#   - overlaps_name is missing or wrong for known check-ins
#
# Inputs:
#   checkin_ids  — comma- or newline-separated check-in IDs or full Swarm URLs
#   recent_count — re-check the N most-recent check-ins regardless of cache (default 0)
#
# After updating checkins.csv, the workflow pushes the changed overlaps to D1
# (check-ins there are append-only, so it reconciles exactly the re-fetched ids,
# whatever their age) and then dispatches "Update check-in dashboard", which
# rebuilds and deploys the site (Pages direct upload; nothing is committed here).
#
# Foursquare allows roughly 500 API calls an hour per token, and the hourly
# update spends some too: keep one run to ~250 ids and space batches an hour apart.
#
# Required secrets:
#   FOURSQUARE_TOKEN  — Foursquare OAuth token
#   DATA_REPO_PAT     — Fine-grained PAT with Contents read/write on foursquare-data
#   CF_D1_TOKEN, CF_ACCOUNT_ID, CF_D1_DATABASE_ID  — for D1 sync
#   R2_PUBLIC_URL     — for photo URL in build (optional)

name: Fix overlapping friends

on:
  workflow_dispatch:
    inputs:
      checkin_ids:
        description: "Check-in IDs or Swarm URLs (comma/space separated)"
        required: false
        default: ""
      recent_count:
        description: "Also re-check this many most-recent check-ins (0 = skip)"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write     # dispatch the deploy workflow at the end

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fix-overlaps:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout public repo (scripts live here) ───────────────────────
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ── 2. Checkout private data repo ────────────────────────────────────
      - uses: actions/checkout@v7
        with:
          repository: toouur/foursquare-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: private-data

      # ── 3. Python setup ──────────────────────────────────────────────────
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Re-fetch overlaps via fetch_checkins.py ───────────────────────
      - name: Re-fetch overlapping friends
        id: recheck
        env:
          FOURSQUARE_TOKEN: ${{ secrets.FOURSQUARE_TOKEN }}
        run: |
          IDS="${{ github.event.inputs.checkin_ids }}"
          RECENT="${{ github.event.inputs.recent_count }}"

          if [ -z "$IDS" ] && { [ -z "$RECENT" ] || [ "$RECENT" = "0" ]; }; then
            echo "No IDs or recent_count provided — nothing to do."
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ARGS="--token $FOURSQUARE_TOKEN --csv private-data/checkins.csv"

          if [ -n "$IDS" ]; then
            ARGS="$ARGS --recheck-ids \"$IDS\""
          fi

          if [ -n "$RECENT" ] && [ "$RECENT" != "0" ]; then
            ARGS="$ARGS --recheck-recent-hours $RECENT"
          fi

          eval python scripts/fetch_checkins.py $ARGS >> "$GITHUB_OUTPUT"

      # ── 5. Commit updated CSV to private data repo ───────────────────────
      - name: Commit updated checkins.csv
        id: commit_data
        if: steps.recheck.outputs.CHANGED == 'true'
        run: |
          cd private-data
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checkins.csv
          if git diff --cached --quiet; then
            echo "No changes to checkins.csv."
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "fix(overlaps): re-fetch overlapping friends"
            # Other workflows push the same data-repo ref — rebase-and-retry (BUG-014).
            for i in 1 2 3 4 5; do
              git push origin HEAD:main && break
              [ "$i" = 5 ] && { echo "push failed after 5 attempts"; exit 1; }
              echo "push rejected (attempt $i) — rebasing onto latest main"
              git pull --rebase origin main
            done
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 6. Sync to D1 ───────────────────────────────────────────────────
      - name: Sync to D1
        if: steps.commit_data.outputs.CHANGED == 'true'
        env:
          CF_D1_TOKEN:       ${{ secrets.CF_D1_TOKEN }}
          CF_ACCOUNT_ID:     ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          if [ -z "$CF_D1_TOKEN" ]; then
            echo "CF_D1_TOKEN not set — skipping D1 sync."
          else
            # --fix-overlaps-ids: the re-fetched check-ins can be years old, past any
            # hours window; --fix-overlaps-hours covers the recent_count input.
            HOURS="${{ github.event.inputs.recent_count }}"
            python scripts/sync_to_d1.py \
              --csv   private-data/checkins.csv \
              --tips  private-data/tips.json \
              --config-dir config \
              --fix-overlaps-ids "${{ github.event.inputs.checkin_ids }}" \
              --fix-overlaps-hours "${HOURS:-0}"
          fi

      # ── 7. Rebuild + deploy through the main workflow ───────────────────
      # The site is deployed by direct upload (generated HTML is gitignored), so
      # hand over to "Update check-in dashboard": a manual dispatch there always
      # rebuilds from the data repo, syncs D1 and deploys.
      - name: Dispatch the dashboard deploy
        if: steps.commit_data.outputs.CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-dashboard.yml --ref main -R "${{ github.repository }}"
