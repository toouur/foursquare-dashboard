# .github/workflows/refresh-venue.yml
#
# Manual workflow: refresh venue metadata (name, city, country, lat, lng,
# category) in checkins.csv and tips.json for a single venue.
#
# Use when:
#   - A venue was renamed or moved (same venue ID, updated fields)
#   - A venue was merged into another (old ID → new ID; pass new_venue_url too)
#
# Paste the Foursquare venue URL from your browser for both fields.
# Leave "new_venue_url" empty unless the venue was merged.
#
# Trigger: Actions tab → "Refresh venue metadata" → Run workflow
#
# Required secrets:
#   FOURSQUARE_TOKEN  — Foursquare OAuth token
#   DATA_REPO_PAT     — Fine-grained PAT with Contents read/write on foursquare-data

name: Refresh venue metadata

on:
  workflow_dispatch:
    inputs:
      venue_url:
        description: "Foursquare venue URL or venue ID (the one in your checkins)"
        required: true
      new_venue_url:
        description: "New venue URL or ID (only if the venue was merged into another)"
        required: false
        default: ""
      closed:
        description: "Mark all matching tips as closed=true (venue has permanently closed)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout public repo (scripts live here) ───────────────────────
      - uses: actions/checkout@v4

      # ── 2. Checkout private data repo ────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          repository: toouur/foursquare-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: private-data

      # ── 3. Python setup ──────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Extract venue IDs from URLs ────────────────────────────────────
      - name: Extract venue IDs
        id: ids
        run: |
          python - <<'EOF'
          import re, os

          def extract(url):
              s = url.strip().rstrip('/')
              m = re.search(r'([0-9a-f]{24})', s)
              return m.group(1) if m else s.split('/')[-1]

          old = extract("${{ github.event.inputs.venue_url }}")
          new = "${{ github.event.inputs.new_venue_url }}".strip()
          new = extract(new) if new else ""

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"old_id={old}\n")
              f.write(f"new_id={new}\n")
          EOF

      # ── 5. Snapshot checkins.csv before refresh (for D1 diff) ────────────
      - name: Snapshot checkins.csv
        run: cp private-data/checkins.csv /tmp/checkins_before.csv

      # ── 6. Refresh venue in checkins.csv (and tips.json) ─────────────────
      - name: Refresh venue metadata
        env:
          FOURSQUARE_TOKEN: ${{ secrets.FOURSQUARE_TOKEN }}
        run: |
          ARGS="--token $FOURSQUARE_TOKEN \
                --csv  private-data/checkins.csv \
                --tips private-data/tips.json \
                --venue-id ${{ steps.ids.outputs.old_id }}"

          if [ -f private-data/venueRatings.json ]; then
            ARGS="$ARGS --ratings private-data/venueRatings.json"
          fi
          if [ -n "${{ steps.ids.outputs.new_id }}" ]; then
            ARGS="$ARGS --new-venue-id ${{ steps.ids.outputs.new_id }}"
          fi
          if [ "${{ github.event.inputs.closed }}" = "true" ]; then
            ARGS="$ARGS --closed"
          fi

          python scripts/refresh_venue.py $ARGS

      # ── 7. Commit updated files ───────────────────────────────────────────
      - name: Commit to private data repo
        id: commit
        run: |
          cd private-data
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add checkins.csv tips.json
          [ -f venueRatings.json ] && git add venueRatings.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit (venue already up to date)."
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          else
            OLD="${{ steps.ids.outputs.old_id }}"
            NEW="${{ steps.ids.outputs.new_id }}"
            if [ -n "$NEW" ]; then
              MSG="fix(venues): merge venue ${OLD} → ${NEW} in checkins + tips"
            else
              MSG="fix(venues): refresh metadata for venue ${OLD} in checkins + tips"
            fi
            git commit -m "$MSG"
            git push
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 8. Sync venue changes to D1 ──────────────────────────────────────
      - name: Sync venue changes to D1
        if: steps.commit.outputs.CHANGED == 'true'
        env:
          CF_D1_TOKEN:       ${{ secrets.CF_D1_TOKEN }}
          CF_ACCOUNT_ID:     ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          if [ -z "$CF_D1_TOKEN" ]; then
            echo "CF_D1_TOKEN not set — skipping D1 sync."
            exit 0
          fi
          # Generate diffs (dry-run so tips.json is not re-patched; --out writes the JSON)
          python scripts/sync_venue_changes.py \
            --old /tmp/checkins_before.csv \
            --new private-data/checkins.csv \
            --tips private-data/tips.json \
            --out /tmp/venue_diffs.json \
            --dry-run
          VENUE_CHANGES_ARG=""
          if [ -f /tmp/venue_diffs.json ]; then
            COUNT=$(python -c "import json; print(len(json.load(open('/tmp/venue_diffs.json'))))")
            if [ "$COUNT" -gt 0 ]; then
              VENUE_CHANGES_ARG="--venue-changes /tmp/venue_diffs.json"
            fi
          fi
          RATINGS_ARG=""
          if [ -f private-data/venueRatings.json ]; then RATINGS_ARG="--ratings private-data/venueRatings.json"; fi
          LISTS_ARG=""
          if [ -f private-data/lists.json ]; then LISTS_ARG="--lists private-data/lists.json"; fi
          RATINGS_CHANGED_ARG=""
          if [ -n "$RATINGS_ARG" ]; then RATINGS_CHANGED_ARG="--ratings-changed true"; fi
          python scripts/sync_to_d1.py \
            --csv   private-data/checkins.csv \
            --tips  private-data/tips.json \
            --trips trips_meta.json \
            $RATINGS_ARG $LISTS_ARG \
            --tips-changed true \
            $RATINGS_CHANGED_ARG \
            $VENUE_CHANGES_ARG
