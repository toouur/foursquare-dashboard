# .github/workflows/resync-all.yml
#
# Single manual entry point for every ad-hoc D1 resync. Tick any combination of
# tables and pick a mode. Replaces the old resync-checkins-d1 / resync-d1 /
# upsert-d1 trio (each was a strict subset of this).
#
#   checkins + venues → always a full wipe + reinsert via the wrangler SQL dump
#     (reliable for 65K rows; the Python batch API is not). `mode` does not apply.
#
#   ratings / tips / trips / lists → controlled by `mode`:
#     • force  — DELETE + full INSERT OR REPLACE  (sync_to_d1 --force-*).
#                Use after a data-export comparison, bulk edit/deletion, or when
#                rows must be REMOVED from D1 (un-rated venues, deleted tips).
#     • upsert — INSERT OR REPLACE only, no DELETE  (sync_to_d1 --*-changed true).
#                Use to push a single added/edited row without a full wipe.
#
# Required secrets:
#   DATA_REPO_PAT      — Fine-grained PAT with Contents read on toouur/foursquare-data
#   CF_D1_TOKEN        — Cloudflare API token with D1:Edit permission
#   CF_ACCOUNT_ID      — Cloudflare account ID
#   CF_D1_DATABASE_ID  — D1 database ID

name: Resync D1 (manual)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Table mode for ratings/tips/trips/lists (checkins is always a full dump)"
        type: choice
        options: [force, upsert]
        default: force
      resync_checkins:
        description: "checkins + venues — SQL dump via wrangler (safe for 65K rows; always full)"
        type: boolean
        default: false
      resync_ratings:
        description: "ratings — from venueRatings.json"
        type: boolean
        default: false
      resync_tips:
        description: "tips — from tips.json"
        type: boolean
        default: false
      resync_trips:
        description: "trips — from trips_meta.json"
        type: boolean
        default: false
      resync_lists:
        description: "lists + list_venues — from lists.json"
        type: boolean
        default: false

jobs:
  resync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: toouur/foursquare-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: private-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── checkins + venues via wrangler SQL dump ───────────────────────────────
      - if: ${{ inputs.resync_checkins == true }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - if: ${{ inputs.resync_checkins == true }}
        name: Install wrangler
        run: npm install -g wrangler

      - if: ${{ inputs.resync_checkins == true }}
        name: Generate SQL dump (split ≤8 MB per file)
        run: |
          python scripts/gen_d1_dump.py \
            --csv private-data/checkins.csv \
            --out /tmp/checkins_venues_dump.sql \
            --split-mb 8

      - if: ${{ inputs.resync_checkins == true }}
        name: Migrate schema (add city_inferred column if missing)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          wrangler d1 execute swarmdata \
            --command="ALTER TABLE checkins ADD COLUMN city_inferred INTEGER DEFAULT 0;" \
            --remote || echo "Column already exists — skipping."

      - if: ${{ inputs.resync_checkins == true }}
        name: Execute checkins+venues dump
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          for f in $(ls /tmp/checkins_venues_dump*.sql | sort); do
            echo "▶ Executing $f ($(du -sh "$f" | cut -f1))"
            wrangler d1 execute swarmdata --file="$f" --remote
          done

      - if: ${{ inputs.resync_checkins == true }}
        name: Verify checkins+venues row counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          wrangler d1 execute swarmdata \
            --command="SELECT 'checkins' tbl,COUNT(*) n FROM checkins UNION ALL SELECT 'venues',COUNT(*) FROM venues UNION ALL SELECT 'empty_id',COUNT(*) FROM checkins WHERE id=''" \
            --remote

      # ── ratings / tips / trips / lists via Python batch API ──────────────────
      - name: Resync other tables
        env:
          CF_D1_TOKEN:       ${{ secrets.CF_D1_TOKEN }}
          CF_ACCOUNT_ID:     ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          if [ -z "$CF_D1_TOKEN" ]; then
            echo "CF_D1_TOKEN not set — cannot run."
            exit 1
          fi

          # force → --force-<table> (DELETE + reinsert); upsert → --<table>-changed true (no DELETE).
          if [ "${{ inputs.mode }}" = "upsert" ]; then
            R="--ratings-changed true"; T="--tips-changed true"; P="--trips-changed true"; L="--lists-changed true"
          else
            R="--force-ratings"; T="--force-tips"; P="--force-trips"; L="--force-lists"
          fi

          FLAGS=""
          [ "${{ inputs.resync_ratings }}" = "true" ] && FLAGS="$FLAGS $R"
          [ "${{ inputs.resync_tips }}"    = "true" ] && FLAGS="$FLAGS $T"
          [ "${{ inputs.resync_trips }}"   = "true" ] && FLAGS="$FLAGS $P"
          [ "${{ inputs.resync_lists }}"   = "true" ] && FLAGS="$FLAGS $L"

          if [ -z "$FLAGS" ]; then
            echo "No non-checkins tables selected — skipping Python sync."
            exit 0
          fi

          RATINGS_ARG=""
          [ -f private-data/venueRatings.json ] && RATINGS_ARG="--ratings private-data/venueRatings.json"
          LISTS_ARG=""
          [ -f private-data/lists.json ] && LISTS_ARG="--lists private-data/lists.json"

          echo "mode=${{ inputs.mode }} flags:$FLAGS"
          python scripts/sync_to_d1.py \
            --csv   private-data/checkins.csv \
            --tips  private-data/tips.json \
            --trips trips_meta.json \
            $RATINGS_ARG $LISTS_ARG \
            $FLAGS
