# .github/workflows/telegram-on-this-day.yml
#
# Daily "on this day" story to Telegram (scripts/telegram_on_this_day.py):
# every earlier year with check-ins on today's date, with places, weather
# (Open-Meteo archive) and a short narrative written by Claude — through the
# API when ANTHROPIC_API_KEY is set, else through the Claude Code CLI with
# CLAUDE_CODE_OAUTH_TOKEN (a Pro/Max subscription token from `claude
# setup-token`) — or a plain template when neither works. Each Claude story is
# kept in otd_stories.json in the data repo (never pruned) and reused by any rerun
# for that date, hand edits included; the `regenerate` input writes a new one.

name: Telegram on this day

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 09:00 in Chișinău (summer) / 08:00 (winter)
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to post for (YYYY-MM-DD, default: today)'
        required: false
        default: ''
      dry_run:
        description: 'Print the message only, send nothing'
        type: boolean
        default: false
      regenerate:
        description: 'Write a new story even if one is stored for that date'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  post:
    if: vars.UPDATES_PAUSED != 'true'
    runs-on: ubuntu-latest
    env:
      # Secrets can't be tested in a step `if`; expose a yes/no flag instead.
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: toouur/foursquare-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: private-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Claude Code CLI, only when the subscription token is configured. A failed
      # install just means the template story.
      - name: Install Claude Code
        if: env.HAS_CLAUDE_TOKEN == 'true'
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code
      - name: Post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Optional separate destination (e.g. a channel); falls back to the
          # chat the failure alerts already go to.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_OTD_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OTD_DATE: ${{ inputs.date }}
          OTD_DRY: ${{ inputs.dry_run }}
          OTD_REGEN: ${{ inputs.regenerate }}
        run: |
          args=(--csv private-data/checkins.csv
                --photos private-data/photos.json
                --pix-url "${{ secrets.R2_PUBLIC_URL }}"
                --stories private-data/otd_stories.json)
          [ -n "$OTD_DATE" ] && args+=(--date "$OTD_DATE")
          [ "$OTD_DRY" = "true" ] && args+=(--dry-run)
          [ "$OTD_REGEN" = "true" ] && args+=(--regenerate)
          python scripts/telegram_on_this_day.py "${args[@]}"
      # 6th data-repo writer: same bounded rebase-and-retry loop as the others (BUG-014).
      - name: Commit story
        if: inputs.dry_run != true
        run: |
          cd private-data
          [ -f otd_stories.json ] || exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add otd_stories.json
          git diff --cached --quiet && exit 0
          git commit -m "otd story $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git push && break
            git pull --rebase origin main
            [ "$i" = 5 ] && { echo "push still failing after rebase retries"; exit 1; }
          done
