# .github/workflows/tests.yml
#
# Test + lint gate for the dashboard code itself (the hourly data pipeline
# lives in update-dashboard.yml and has its own verify job).
#
#   lint  — ruff over scripts/ and tests/ (config: ruff.toml) + mypy over
#           scripts/ (pragmatic config: setup.cfg [mypy], not strict)
#   unit  — pytest offline suite: metrics/transform/companions unit tests
#           (everything NOT marked `live`). No secrets, no network.
#   live  — API contract + Playwright E2E smoke tests against the deployed
#           site (marked `live`). Runs weekly + on demand only, so a site
#           outage never blocks a code push.
#
# The README badge tracks this workflow.

name: Tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "functions/**"
      - "config/**"
      - "requirements.txt"
      - "ruff.toml"
      - "setup.cfg"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00 UTC — weekly live E2E sweep
  workflow_dispatch:

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff + mypy
        run: pip install ruff mypy
      - name: Ruff check
        run: python -m ruff check scripts/ tests/
      - name: Mypy check
        run: python -m mypy

  unit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run offline test suite
        run: python -m pytest tests/ -m "not live" -q

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40   # ~18 min normally; a lost runner must not hang for hours
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-playwright
      - name: Install chromium
        run: python -m playwright install chromium --with-deps
      # A green run full of skips proves nothing: LIVE_MAX_SKIPS (conftest.py)
      # turns more than that many skipped live tests into a failure. Traces and
      # screenshots are kept for failed browser tests only (pytest-playwright).
      - name: Run live suite (API contract + E2E smoke)
        timeout-minutes: 30   # a step timeout fails the step, so the alert below still runs
        env:
          LIVE_MAX_SKIPS: "0"
        run: >-
          python -m pytest tests/ -m live -q -rfs
          --tracing retain-on-failure --screenshot only-on-failure --output test-results
          2>&1 | tee live.txt; exit ${PIPESTATUS[0]}
      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          path: |
            test-results/
            live.txt
          retention-days: 14
          if-no-files-found: ignore
      # The weekly sweep was red every Monday from August to October 2026 and
      # nobody saw it — GitHub's email drowned. Say it in Telegram instead.
      - name: Alert on a failed weekly sweep
        if: failure() && github.event_name == 'schedule'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "Telegram secrets not set — skipping alert."; exit 0; fi
          FAILED=$(grep -E '^FAILED ' live.txt 2>/dev/null | sed -E 's/^FAILED tests\/([^ ]*).*/\1/' | head -6)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TG_CHAT}" \
            --data-urlencode text="🟠 4sq dashboard: weekly live tests failed
          ${FAILED:-(no FAILED lines — timeout or setup error)}
          ${RUN_URL}" > /dev/null && echo "Telegram alert sent."
