# .github/workflows/archive-checkins.yml
#
# Full re-fetch of all check-ins from Foursquare, archive the previous
# checkins.csv (timestamped), store the fresh one, then automatically diff
# old vs new to detect venue renames/moves and sync any changes into tips.json.
#
# Triggers:
#   • Monthly — 02:30 UTC on the 1st (schedule below).
#   • Manual  — Actions tab → "Archive check-in snapshot" → Run workflow.
#
# SAFETY: the full re-fetch runs with continue-on-error, so a quota/network
# failure can leave a TRUNCATED checkins.csv. Because D1 venue reconciliation
# deletes venues absent from the CSV, an unattended run on a truncated snapshot
# would mass-delete venues. The "Guard against truncated re-fetch" step aborts
# the job (before any commit or D1 sync) if the new snapshot is < 95% of the
# archived one by rows OR unique venues.
#
# Required secrets (same as update-dashboard):
#   FOURSQUARE_TOKEN  — Foursquare OAuth token
#   DATA_REPO_PAT     — Fine-grained PAT with Contents read/write on toouur/foursquare-data

name: Archive check-in snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 1 * *"   # 02:30 UTC on the 1st of each month

permissions:
  contents: read   # public repo read-only; private repo access via PAT

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout public repo (scripts live here) ───────────────────────
      - uses: actions/checkout@v4

      # ── 2. Checkout private data repo ────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          repository: toouur/foursquare-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: private-data

      # ── 3. Python setup ──────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Archive current checkins.csv with a timestamp ─────────────────
      - name: Archive existing checkins.csv
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          mkdir -p private-data/archive
          if [ -f private-data/checkins.csv ]; then
            cp private-data/checkins.csv "private-data/archive/checkins_${TIMESTAMP}.csv"
            echo "Archived checkins.csv as archive/checkins_${TIMESTAMP}.csv"
            echo "ARCHIVE_NAME=checkins_${TIMESTAMP}.csv" >> "$GITHUB_ENV"
          else
            echo "No existing checkins.csv to archive."
            echo "ARCHIVE_NAME=" >> "$GITHUB_ENV"
          fi

      # ── 5. Full re-fetch all check-ins from Foursquare ───────────────────
      # continue-on-error: partial results are saved even if quota is hit midway
      - name: Full re-fetch check-ins
        continue-on-error: true
        env:
          FOURSQUARE_TOKEN: ${{ secrets.FOURSQUARE_TOKEN }}
        run: |
          python scripts/fetch_checkins.py \
            --token "$FOURSQUARE_TOKEN" \
            --csv private-data/checkins.csv \
            --full \
            --deleted-out /tmp/swarm_deleted.txt

      # ── 6. Guard against a truncated re-fetch ─────────────────────────────
      # Full re-fetch runs continue-on-error, so a quota/network failure can
      # leave a partial checkins.csv. Abort BEFORE any commit or D1 sync if the
      # new snapshot lost > 5% of rows or unique venues vs the archived one
      # (check-ins only grow; a large drop means a truncated fetch, not real
      # deletions). First run (no archive) skips the guard.
      - name: Guard against truncated re-fetch
        run: |
          if [ -z "$ARCHIVE_NAME" ]; then
            echo "No archived snapshot to compare against — skipping guard."
            exit 0
          fi
          python - "private-data/archive/${ARCHIVE_NAME}" private-data/checkins.csv <<'PY'
          import csv, sys

          def counts(path):
              rows = 0
              venues = set()
              with open(path, encoding="utf-8", newline="") as fh:
                  for r in csv.DictReader(fh):
                      rows += 1
                      vid = (r.get("venue_id") or "").strip()
                      if vid:
                          venues.add(vid)
              return rows, len(venues)

          old_path, new_path = sys.argv[1], sys.argv[2]
          old_rows, old_venues = counts(old_path)
          new_rows, new_venues = counts(new_path)
          print(f"old snapshot: {old_rows} rows / {old_venues} venues")
          print(f"new snapshot: {new_rows} rows / {new_venues} venues")

          FLOOR = 0.95
          bad = []
          if old_rows and new_rows < FLOOR * old_rows:
              bad.append(f"rows {new_rows} < 95% of {old_rows}")
          if old_venues and new_venues < FLOOR * old_venues:
              bad.append(f"venues {new_venues} < 95% of {old_venues}")
          if bad:
              print("::error::truncated re-fetch suspected — " + "; ".join(bad))
              print("Aborting before commit / D1 sync. Re-run manually once the "
                    "Foursquare fetch completes fully.")
              sys.exit(1)
          print("Guard passed — snapshot is complete enough to sync.")
          PY

      # ── 6b. Remove check-ins deleted in Swarm ────────────────────────────
      # The full re-fetch above updates every row Swarm still has (renames,
      # cities, venue merges — matched by checkin_id), but a check-in deleted
      # in Swarm is simply absent from it. fetch_checkins.py lists one only when
      # ALL of these hold: the walk reached the server total, at most 50 rows
      # are absent, and Swarm answers "Invalid checkin id" for that exact id.
      # A partial fetch (quota, 500s) therefore deletes nothing — on 2026-04-21
      # one stopped at 55.6k of 69.8k and 14k real check-ins looked "missing".
      # Removal goes through delete_checkin.py: CSV + D1 + orphan venues +
      # photos.json, and the freed images leave R2 in the next step.
      - name: Remove check-ins deleted in Swarm
        id: swarm_del
        env:
          CF_D1_TOKEN:       ${{ secrets.CF_D1_TOKEN }}
          CF_ACCOUNT_ID:     ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          if [ ! -s /tmp/swarm_deleted.txt ]; then
            echo "No check-ins deleted in Swarm."
            exit 0
          fi
          echo "Deleted in Swarm (confirmed per id):"
          cat /tmp/swarm_deleted.txt
          python scripts/delete_checkin.py \
            --ids "$(paste -sd, /tmp/swarm_deleted.txt)" \
            --csv private-data/checkins.csv \
            --photos private-data/photos.json

      - name: Delete freed photos from R2
        if: steps.swarm_del.outputs.PHOTO_COUNT != '' && steps.swarm_del.outputs.PHOTO_COUNT != '0'
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME:        ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -z "$R2_BUCKET_NAME" ]; then
            echo "R2 secrets not configured — skipping (photos.json already pruned)."
            exit 0
          fi
          pip install awscli --quiet
          for f in ${{ steps.swarm_del.outputs.PHOTO_FILES }}; do
            echo "removing pix/$f"
            aws s3 rm "s3://${R2_BUCKET_NAME}/pix/$f" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            aws s3 rm "s3://${R2_BUCKET_NAME}/pix/t/$f" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" || true
          done

      # ── 7. Diff old vs new — detect venue renames/moves, sync tips + backfill ─
      # backfill.csv reuses the SAME real venue_ids, so a rename that lands in
      # checkins.csv must follow through there too — otherwise one venue_id shows
      # two different names (and sync_to_d1 re-seeds the stale one into /api/feed
      # on every run, since rf* rows are reconciled rather than append-only).
      - name: Sync venue changes into tips.json + backfill.csv + JSONs
        run: |
          if [ -n "$ARCHIVE_NAME" ] && [ -f "private-data/tips.json" ]; then
            EXTRA_ARGS=""
            if [ -f private-data/backfill.csv ]; then
              EXTRA_ARGS="$EXTRA_ARGS --backfill private-data/backfill.csv"
            fi
            if [ -f private-data/venueRatings.json ]; then
              EXTRA_ARGS="$EXTRA_ARGS --ratings private-data/venueRatings.json"
            fi
            if [ -f private-data/comments.json ]; then
              EXTRA_ARGS="$EXTRA_ARGS --comments private-data/comments.json"
            fi
            python scripts/sync_venue_changes.py \
              --old "private-data/archive/${ARCHIVE_NAME}" \
              --new  private-data/checkins.csv \
              --tips private-data/tips.json \
              $EXTRA_ARGS \
              --out  /tmp/venue_diffs.json
          else
            echo "No archive snapshot or no tips.json — skipping venue diff."
          fi

      # ── 8. Commit archive + fresh CSV + updated tips to private data repo ──
      - name: Commit to private data repo
        run: |
          cd private-data
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add checkins.csv tips.json
          if [ -f backfill.csv ];       then git add backfill.csv;       fi
          if [ -f checkin_likes.json ]; then git add checkin_likes.json; fi
          if [ -f venueRatings.json ];  then git add venueRatings.json;  fi
          if [ -f comments.json ];      then git add comments.json;      fi
          if [ -f photos.json ];        then git add photos.json;        fi
          [ -n "$ARCHIVE_NAME" ] && git add "archive/${ARCHIVE_NAME}"
          [ -f checkins_anomalies.json ] && git add checkins_anomalies.json
          [ -f duplicate_checkins.csv  ] && git add duplicate_checkins.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore: full check-in snapshot [${TIMESTAMP}]"
            # The hourly job may commit a new check-in (checkins.csv + photos.json)
            # while this one re-fetches — same files, so a plain rebase collides.
            # resolve_archive_rebase.py merges exactly those two by content (the
            # fresh snapshot + rows added upstream, minus Swarm deletions); any
            # other conflict aborts the run, to be re-run by hand.
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              [ "$i" = 5 ] && { echo "push still failing after rebase retries"; exit 1; }
              echo "push rejected (attempt $i) — rebasing onto latest main"
              if ! git pull --rebase origin main; then
                if python ../scripts/resolve_archive_rebase.py --deleted /tmp/swarm_deleted.txt \
                   && GIT_EDITOR=true git rebase --continue; then
                  echo "rebase conflict resolved by content"
                else
                  git rebase --abort || true
                  echo "::error::data-repo rebase conflict outside checkins.csv/photos.json — re-run the job"
                  exit 1
                fi
              fi
            done
          fi

      # ── 9. Sync check-ins, venue changes, and tips to D1 ─────────────────
      - name: Sync to D1
        env:
          CF_D1_TOKEN:       ${{ secrets.CF_D1_TOKEN }}
          CF_ACCOUNT_ID:     ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          if [ -z "$CF_D1_TOKEN" ]; then
            echo "CF_D1_TOKEN not set — skipping D1 sync."
            exit 0
          fi
          VENUE_CHANGES_ARG=""
          if [ -f /tmp/venue_diffs.json ]; then
            COUNT=$(python -c "import json; print(len(json.load(open('/tmp/venue_diffs.json'))))")
            if [ "$COUNT" -gt 0 ]; then
              VENUE_CHANGES_ARG="--venue-changes /tmp/venue_diffs.json"
            fi
          fi
          RATINGS_ARG=""
          if [ -f private-data/venueRatings.json ]; then RATINGS_ARG="--ratings private-data/venueRatings.json"; fi
          LISTS_ARG=""
          if [ -f private-data/lists.json ]; then LISTS_ARG="--lists private-data/lists.json"; fi
          # --backfill is NOT optional here. The venue table is reconciled against
          # the rows this run loads, and 31 reconstructed venues (Gin Do & Contrabass,
          # Biblioteca Lomonosov, Zatoka, …) have no real check-in at all. Without the
          # flag they read as orphans and get DELETEd every month, then re-inserted by
          # the next hourly run — /api/search loses them in between. The same omission
          # made the drift check compare D1 (real + rf) against checkins.csv alone.
          BACKFILL_ARG=""
          if [ -f private-data/backfill.csv ]; then BACKFILL_ARG="--backfill private-data/backfill.csv"; fi
          python scripts/sync_to_d1.py \
            --csv   private-data/checkins.csv \
            --tips  private-data/tips.json \
            --trips trips_meta.json \
            $RATINGS_ARG $LISTS_ARG $BACKFILL_ARG \
            --tips-changed true \
            $VENUE_CHANGES_ARG
