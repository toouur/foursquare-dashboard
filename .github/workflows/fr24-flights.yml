# .github/workflows/fr24-flights.yml
#
# FlightRadar24 flight-diary fetcher (weekly, fully automated).
#
# FR24 has no personal-diary API. This job logs in with your account
# credentials (secret FR24_LOGIN = "email:password"), which mints a fresh
# session in-script — there is NO stored cookie to expire, so no manual
# refresh is ever needed. It then downloads the diary CSV from the real
# endpoint https://my.flightradar24.com/public-scripts/export and commits it
# to the private data repo as flights.csv when it changed, so build.py picks
# up new flights on the next dashboard rebuild.
#
# Login is a plain JSON API (no CAPTCHA); posting to www.flightradar24.com
# sets shared cookies and a GET to my.flightradar24.com completes the SSO
# handshake the diary export needs. See scripts/fetch_flights.py for details.
#
# Exit contract from the fetcher:
#   0  auth OK, CSV fetched (committed if changed)
#   2  credentials rejected  -> job FAILS on purpose so GitHub emails the owner
#   1  transient error       -> neutral, does NOT fail the run
#
# Required secrets:
#   FR24_LOGIN     — "email:password" for the FR24 account.
#   DATA_REPO_PAT  — fine-grained PAT with Contents read/write on
#                    toouur/foursquare-data.

name: FR24 flights (weekly)

on:
  schedule:
    - cron: '0 5 * * 0'   # Sunday 05:00 UTC
  workflow_dispatch:

jobs:
  fr24:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: toouur/foursquare-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: private-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install requests

      - name: Fetch FR24 diary export
        id: fetch
        env:
          FR24_LOGIN: ${{ secrets.FR24_LOGIN }}
        run: |
          set +e
          python scripts/fetch_flights.py --out private-data/flights.csv | tee out.txt
          CODE=${PIPESTATUS[0]}
          set -e
          VALID=$(grep -m1 '^COOKIE_VALID=' out.txt | cut -d= -f2)
          CHANGED=$(grep -m1 '^CHANGED=' out.txt | cut -d= -f2)
          echo "valid=${VALID:-unknown}"   >> "$GITHUB_OUTPUT"
          echo "changed=${CHANGED:-false}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}"              >> "$GITHUB_OUTPUT"
          {
            echo "### FR24 flights fetch — $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "- **auth valid**: \`${VALID:-unknown}\`"
            echo "- **exit code**: \`${CODE}\` (0 ok · 1 transient · 2 bad credentials)"
            echo "- **CSV changed**: \`${CHANGED:-false}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated flights.csv
        if: steps.fetch.outputs.changed == 'true'
        run: |
          cd private-data
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flights.csv
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update flights.csv from FR24 [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            # update-dashboard / warm-routes may push to the same data-repo ref
            # between our checkout and this push → non-fast-forward. Rebase-and-retry.
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              echo "push rejected (attempt $i) — rebasing onto latest main"
              git pull --rebase origin main
              [ "$i" = 5 ] && { echo "push still failing after rebase retries"; exit 1; }
            done
          fi

      # Fail ONLY on rejected credentials (exit 2) so the failure email prompts
      # a password/secret fix. Transient errors (exit 1) pass quietly.
      - name: Alarm if credentials rejected
        if: steps.fetch.outputs.code == '2'
        run: |
          echo "::error::FR24_LOGIN was rejected (bad credentials or blocked login). Verify the email:password in the FR24_LOGIN secret."
          exit 1
